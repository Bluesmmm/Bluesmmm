name: Update README with ML Quotes (Bilingual)

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:      # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'README.template.md'
      - 'README_EN.template.md'
      - 'scripts/update_readme.py'

jobs:
  update-ml-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Update README with ML/Python quotes (Bilingual)
        run: python scripts/update_readme.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md README_EN.md
          git diff --quiet && git diff --staged --quiet || git commit -m "[Automated] Update README with ML quotes (🇨🇳🇺🇸)"
          git push
